name: Publish BetterHUD

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Build static pages
        run: python site/build.py --output dist --origin https://virojet.github.io
      - name: Validate pages and links
        run: python site/validate.py --output dist
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload website
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
